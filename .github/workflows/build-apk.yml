name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 1. Generate Gradle Wrapper if missing
      - name: Generate Gradle Wrapper if missing
        run: gradle wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 2. Generate debug.keystore expected by signingConfig 'debugConfig'
      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 3. Generate dummy google-services.json matching your package name
      - name: Generate Dummy Google Services File
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.applet.waqfof"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly"
                  }
                ]
              }
            ]
          }
          EOF

      # 4. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -Djava.awt.headless=true
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Xmx4096m"

      # 5. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
